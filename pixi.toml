[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "dista.mojo"
version = "0.6.2"
description = "Distributed tasks for Mojo: mark a function remote, call it, and the work runs across a cluster."
preview = ["pixi-build"]
# linux-aarch64 lets the container image build natively on ARM hosts, such as
# Docker on Apple silicon.
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tasks]
# The unit tests, tests/test_*.mojo, built once into one binary and each run
# as its own process (scripts/test.sh); `test-codec` and the others below run
# one file from it. test-libc-abi and test-head-loop stay builds of their own
# (scripts/test.sh says why).
test-units = { cmd = "sh scripts/test.sh" }
test-codec = { cmd = "sh scripts/test.sh test_codec" }
test-frame = { cmd = "sh scripts/test.sh test_frame" }
test-auth = { cmd = "sh scripts/test.sh test_auth" }
test-runtime = { cmd = "sh scripts/test.sh test_runtime" }
test-batches = { cmd = "sh scripts/test.sh test_batches" }
test-free = { cmd = "sh scripts/test.sh test_free" }
test-actors = { cmd = "sh scripts/test.sh test_actors" }
test-arity = { cmd = "sh scripts/test.sh test_arity" }
test-shuffle = { cmd = "sh scripts/test.sh test_shuffle" }
test-take = { cmd = "sh scripts/test.sh test_take" }
test-admission = { cmd = "sh scripts/test.sh test_admission" }
test-head-queue = { cmd = "sh scripts/test.sh test_head_queue" }
# Built on its own: its `signal` declaration clashes with dista's (scripts/test.sh).
test-head-loop = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_head_loop.mojo -o build/test-head-loop && ./build/test-head-loop" }
test-fetch = { cmd = "sh scripts/test.sh test_fetch" }
test-spill = { cmd = "sh scripts/test.sh test_spill" }
test-timeline = { cmd = "sh scripts/test.sh test_timeline" }
test-cancel = { cmd = "sh scripts/test.sh test_cancel" }
test-wait = { cmd = "sh scripts/test.sh test_wait" }
test-head-drivers = { cmd = "sh scripts/test.sh test_head_drivers" }
test-scale = { cmd = "sh scripts/test.sh test_scale" }
test-executors = { cmd = "sh scripts/test.sh test_executors" }
test-slots = { cmd = "sh scripts/test.sh test_slots" }
test-libc-abi = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_libc_abi.mojo -o build/test-libc-abi && ./build/test-libc-abi" }
test-sizing = { cmd = "sh scripts/test.sh test_sizing" }
test-cluster = { cmd = "tests/cluster.sh" }
test-restart = { cmd = "tests/head_restart.sh" }
test-locality = { cmd = "tests/locality.sh" }
test-compile-fail = { cmd = "tests/compile_fail.sh" }
test-metrics = { cmd = "tests/metrics.sh" }
test-drain = { cmd = "tests/drain.sh" }
test-peer-loss = { cmd = "tests/peer_loss.sh" }
test-peer-connect = { cmd = "tests/peer_connect.sh" }
test-autoscale = { cmd = "tests/autoscale.sh" }
test-cli = { cmd = "tests/cli.sh" }
test-chaos = { cmd = "CHAOS_FAST=1 tests/chaos.sh" }
test-kind = { cmd = "tests/kind.sh" }
# The test binaries built several at once before the tasks that copy them
# (scripts/build-tests.sh, scripts/mojo-build.sh): the unit tests' one
# binary, test-libc-abi's, test-head-loop's and build/dista.
build-tests = { cmd = "scripts/build-tests.sh" }
test = { depends-on = ["build-tests", "test-units", "test-libc-abi", "test-head-loop", "test-cluster", "test-restart", "test-locality", "test-compile-fail", "test-metrics", "test-drain", "test-peer-loss", "test-peer-connect", "test-autoscale", "test-cli", "test-chaos"] }
cli = { cmd = "scripts/mojo-build.sh -I src $DEP_INC cli/main.mojo -o build/dista" }
bench = { cmd = "scripts/mojo-build.sh -I src $DEP_INC bench/fanout.mojo -o build/bench-fanout && ./build/bench-fanout" }
bench-slots = { cmd = "scripts/mojo-build.sh -I src $DEP_INC bench/slots.mojo -o build/bench-slots && ./build/bench-slots" }
bench-sizing = { cmd = "bench/sizing.sh" }
bench-fetch = { cmd = "scripts/mojo-build.sh -I src $DEP_INC bench/fetch.mojo -o build/bench-fetch && FETCH_MODE=sockets ./build/bench-fetch && FETCH_MODE=store ./build/bench-fetch" }

[package]
name = "dista-mojo"
version = "0.6.2"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/dista"
name = "dista"
# The dependencies' .mojoc files, which their packages install there.
extra-args = ["-I", "$PREFIX/lib/mojo"]

[package.host-dependencies]
mojo-compiler = "==1.3.0.dev2026112605"
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "a6a3d3072810d4b502be35ddb7bccda07ddc6b01" }
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "308a48360005009c8b1e72d261d784018694d1fd" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ca8cdac533b2a155e83233d97146fc0267c642ad" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "215abd5c3fd47e38ef14b44fd32dceb6059c134f" }

[package.build-dependencies]
mojo-compiler = "==1.3.0.dev2026112605"

[package.run-dependencies]
mojo-compiler = "==1.3.0.dev2026112605"
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "a6a3d3072810d4b502be35ddb7bccda07ddc6b01" }
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "308a48360005009c8b1e72d261d784018694d1fd" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ca8cdac533b2a155e83233d97146fc0267c642ad" }
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "215abd5c3fd47e38ef14b44fd32dceb6059c134f" }

# One toolchain: the tin, its tests and every consumer use the same Mojo
# nightly. A precompiled Mojo package (.mojoc) loads only in the compiler
# version that built it, so the pin is exact here and in [package] above, and
# it moves across all magmalake tins together. The tins below are pinned at
# revisions built with it.
[dependencies]
mojo-compiler = "==1.3.0.dev2026112605"
# memory-region backs the node-local object store: large results go into
# shared mappings that other processes on the same host map by path.
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "308a48360005009c8b1e72d261d784018694d1fd" }
# arrow-mlake carries columnar results: a task can take or return a
# RecordBatch, and it travels as an Arrow IPC stream.
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "a6a3d3072810d4b502be35ddb7bccda07ddc6b01" }
# objectstore writes actor checkpoints to DISTA_CHECKPOINT_URI, a local
# directory or s3://. The same revision as the data environment's.
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ca8cdac533b2a155e83233d97146fc0267c642ad" }
# threads runs a worker's tasks on DISTA_WORKER_SLOTS threads.
threads-mojo = { git = "https://github.com/magmalake/threads.mojo", rev = "215abd5c3fd47e38ef14b44fd32dceb6059c134f" }

# DEP_INC holds the include flags for the tins dista imports: here they are
# the packages above, so it adds nothing; the data environment compiles them
# from checkouts next door instead.
[activation.env]
DEP_INC = "-I src"

# `mojo-compiler` ships no formatter; the `mojo` package does, at the same
# version. The environment takes `no-default-feature`, so its tasks live in
# the feature. `mojo format` has no check mode, so format-check formats and
# then asserts the tree did not move.
[feature.fmt.dependencies]
mojo = "==1.3.0.dev2026112605"

[feature.fmt.tasks]
fmt = { cmd = "mojo format src tests bench examples deploy fuzz cli" }
format-check = { cmd = "mojo format src tests bench examples deploy fuzz cli && git diff --exit-code -- src tests bench examples deploy fuzz cli" }

# The data environment runs dista tasks over parquet.mojo and iceberg.mojo.
# Their Mojo sources compile from checkouts next to this one, as their own
# tests do, rather than as packages: parquet-mojo and iceberg-mojo's published
# packages pin an older arrow-mlake and were built by an older compiler, and
# two builds of one package can't share an environment. CI lays the checkouts
# out at the revisions of their Mojo 1.3 nightly ports, the tins at the same
# revisions as the pins here. The FFI tins are packages as well as checkouts:
# the package is what installs the C shim each one links.
[feature.data.dependencies]
mojo-compiler = "==1.3.0.dev2026112605"
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ca8cdac533b2a155e83233d97146fc0267c642ad" }
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo", rev = "09ad0248af6713406ccdbf843301b47733fa55f3" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "c239ce5c7be0a80a9e58f1fb2d2d1399c99f4500" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo", rev = "fafcaf4f303fe297c0f43b99fcf420591ad9afb8" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "604d1da685f170f895d93197c4ef0aa2f3dfb30d" }
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "7cff96daa58ec2b2d479ca8b57ba14c15f80ea75" }
libcurl = ">=8,<9"
libsqlite = ">=3.45,<4"
libpq = ">=16,<19"

[feature.data.activation.env]
DEP_INC = "-I ../memory-region.mojo/src -I ../arrow-mlake.mojo/src -I ../parquet.mojo/src -I ../parquet.mojo/full/src -I ../threads.mojo/src -I ../threads.mojo/compat -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../deflate.mojo/src -I ../avro.mojo/src -I ../roaring.mojo/src -I ../objectstore.mojo/src -I ../zstd.mojo/src -I ../lz4.mojo/src -I ../brotli.mojo/src -I ../sqlite.mojo -I ../postgres.mojo/src -I ../iceberg.mojo/src"

[feature.data.tasks]
test-parquet = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_parquet_tasks.mojo -o build/test-parquet && ./build/test-parquet" }
test-iceberg = { cmd = "scripts/mojo-build.sh -I src $DEP_INC tests/test_iceberg_scan.mojo -o build/test-iceberg && ./build/test-iceberg" }
build-data-tests = { cmd = "scripts/build-tests.sh tests/test_parquet_tasks.mojo tests/test_iceberg_scan.mojo" }
test-data = { depends-on = ["build-data-tests", "test-parquet", "test-iceberg"] }
bench-readpath = { cmd = "scripts/mojo-build.sh -I src $DEP_INC bench/readpath.mojo -o build/readpath && ./build/readpath" }

# Fuzzing with mozz (packaged for magmalake as mozz_mlake), as flare does: one
# harness per parser or protocol under fuzz/, built with every bounds check
# on. Each harness writes the input it's running to build/fuzz-<name>-last.bin
# first, so a hard abort still leaves the crashing input behind; mozz saves
# the ones it catches to build/fuzz-crashes/. FUZZ_RUNS sets the iterations.
[feature.fuzz.dependencies]
mozz_mlake = { git = "https://github.com/magmalake/mozz_mlake.git", rev = "1180710bcedd42a2268824ce3db02fe71ebf7569" }

[feature.fuzz.tasks]
fuzz-frames = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src $DEP_INC fuzz/fuzz_frames.mojo -o build/fuzz-frames && ./build/fuzz-frames" }
fuzz-codec = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src $DEP_INC fuzz/fuzz_codec.mojo -o build/fuzz-codec && ./build/fuzz-codec" }
fuzz-payloads = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src $DEP_INC fuzz/fuzz_payloads.mojo -o build/fuzz-payloads && ./build/fuzz-payloads" }
fuzz-head = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src $DEP_INC fuzz/fuzz_head.mojo -o build/fuzz-head && ./build/fuzz-head" }
fuzz-scale = { cmd = "scripts/mojo-build.sh -D ASSERT=all -I src $DEP_INC fuzz/fuzz_scale.mojo -o build/fuzz-scale && ./build/fuzz-scale" }
fuzz = { depends-on = ["fuzz-frames", "fuzz-codec", "fuzz-payloads", "fuzz-head", "fuzz-scale"] }

[environments]
fuzz = ["fuzz"]
fmt = { features = ["fmt"], no-default-feature = true }
data = { features = ["data"], no-default-feature = true }
